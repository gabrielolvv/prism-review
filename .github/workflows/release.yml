name: Release

# Pushing a version tag creates its GitHub release, with the notes from CHANGELOG.md. Tags pushed
# before this workflow existed, or more than three at once, start no run, so their releases can be
# created from the Actions tab with the tag as input.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to create the release for, such as v0.19.0"
        required: true
      latest:
        description: "Mark it as the latest release"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release:
    # Creating a release needs write access to the repository's contents.
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      # A tag push checks out the tag; a manual run checks out the default branch, whose
      # CHANGELOG.md has every version.
      - uses: actions/checkout@v4
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          LATEST: ${{ github.event_name == 'push' || inputs.latest }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The tag must be a version tag such as v0.19.0."
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "v$(node -p 'require("./package.json").version')" != "$TAG" ]; then
            echo "::error::The tag does not match the version in package.json."
            exit 1
          fi
          node scripts/release-notes.mjs "$TAG" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --latest="$LATEST"

  npm:
    # Publishes the CLI to npm with trusted publishing, once the release exists. It runs only when
    # the repository variable NPM_PUBLISH is true; docs/releasing.md describes the setup.
    needs: release
    if: github.event_name == 'push' && vars.NPM_PUBLISH == 'true'
    # npm exchanges the workflow's OIDC token for a short-lived publish token, so no npm token is
    # stored, and records provenance that links the package to this workflow run.
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Install scripts are skipped, since this job can mint a publish token; esbuild works without its own.
      - name: Check the committed CLI bundle
        run: |
          npm ci --ignore-scripts
          npm run bundle
          git diff --exit-code -- dist
      # Trusted publishing needs npm 11.5.1 or later, which current Node.js 24 releases include.
      - name: Publish
        run: npm publish --provenance --access public --ignore-scripts
