name: "Prism Review"
description: "Review pull requests for risk signals before human review."
author: "Prism Review"
inputs:
  github-token:
    description: "GitHub token used to read pull request data and publish comments."
    required: true
  config-path:
    description: "Repository path of the Prism Review configuration file, read from the pull request base commit."
    required: false
    default: ".prism-review.yml"
  dry-run:
    description: "Render the review without publishing a pull request comment."
    required: false
    default: "false"
outputs:
  risk-level:
    description: "Overall risk level of the review: low, medium, or high."
  high-count:
    description: "Number of high-risk findings."
  warning-count:
    description: "Number of warning findings."
  finding-count:
    description: "Number of findings of every severity, including info."
runs:
  using: "node24"
  main: "dist/action/index.cjs"
